<!DOCTYPE html>
<html>
<body>
<p> Finding the sum of arguments using the arguments object.</p>
<p id="result"></p>
<script>
    function findSum(){
        var i;
        var sum = 0; 
        for (i = 0; i < arguments.length; i++){
            sum = sum + arguments[i]; 
        }
        return sum;
    }
    document.getElementById("result").innerHTML = findSum(4, 5, 6, 45, 250);
</script>
</body>
</html>
