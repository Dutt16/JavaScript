
<!DOCTYPE html>
<html>
<body>

<p id="date"></p>

<h2>JavaScript While Loop - Random Numbers</h2>

<p id="number"></p>

<script>
    var today = new Date();
    var dateString = today.toDateString();
    document.getElementById("date").innerHTML = "Today's date is: " + dateString;

    var text = "";
    var count = 0;
    var max_numbers = 10; 

    while (count < max_numbers) {
  
        var randomNum = Math.floor(Math.random() * 100) + 1;
        text += "<br>The random number is " + randomNum;
        count++;
    }

    document.getElementById("number").innerHTML = text;
</script>

</body>
</html>
