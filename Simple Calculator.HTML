<!DOCTYPE html>

<body>

    <h1>JavaScript Variables</h1>
    <p>Sum of two numbers</p>
    <p id="result"></p>
    <p>Difference of two numbers</p>
    <p id="result1"></p>
    <p>Product of two numbers</p>
    <p id="result2"></p>
    <p>Quotient of two numbers</p>
    <p id="result3"></p>
    <script>
       var num1=54;
       var num2=42;
       var sum= num1 + num2;

       document.getElementById("result").innerHTML =
       "the total sum of:" +num1 +"and" +num2+"=" +sum;

       var num1=2387;
       var num2=1023;
       var difference= num1 - num2;

       document.getElementById("result1").innerHTML =
       "the difference of:" +num1 +"and" +num2+"=" +difference;

       var num1=67;
       var num2=87;
       var product= num1 * num2;

       document.getElementById("result2").innerHTML =
       "the product of:" +num1 +"and" +num2+"=" +product;

       var num1=150;
       var num2=50;
       var quotient= num1 / num2;

       document.getElementById("result3").innerHTML =
       "the quotient of:" +num1 +"and" +num2+"=" +quotient;

       </script>
    
</body>
</html>
